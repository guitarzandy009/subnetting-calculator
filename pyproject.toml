[project]
name = "subnetting-calculator"
version = "0.1.0"
description = "A calculator built with Python to learn network subnetting."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subnetcalc"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
